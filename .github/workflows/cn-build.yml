name: ILoveNotch CN macOS build

on:
  push:
    branches: [cn-localization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate Chinese localization sources
        run: |
          plutil -lint Resources/zh-Hans.lproj/Localizable.strings
          plutil -lint Resources/zh-Hans.lproj/InfoPlist.strings
          python3 - <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("Resources/zh-Hans.lproj/Localizable.strings")
          source = path.read_text(encoding="utf-8")
          keys = re.findall(r'^\\s*"((?:\\\\.|[^"\\\\])*)"\\s*=', source, re.M)
          duplicates = sorted({key for key in keys if keys.count(key) > 1})
          if duplicates:
              print("Duplicate localization keys:", *duplicates, sep="\\n  ")
              sys.exit(1)
          print(f"Validated {len(keys)} unique Simplified Chinese localization keys.")
          PY
      - name: Generate project
        run: make project
      - name: Build universal Release
        run: |
          xcodebuild -project OpenNotch.xcodeproj -scheme OpenNotch -configuration Release \
            -destination 'platform=macOS' -derivedDataPath .build/xcode \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='-' \
            OPENNOTCH_COMMIT="${GITHUB_SHA::7}" build
      - name: Verify built app bundle
        run: |
          APP=".build/xcode/Build/Products/Release/ILoveNotch.app"
          test -d "$APP"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          plutil -lint "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          plutil -lint "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/ILoveNotch")"
          echo "Built architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p "$HOME/Applications"
          ditto "$APP" "$HOME/Applications/ILoveNotch 中文版.app"
          test -x "$HOME/Applications/ILoveNotch 中文版.app/Contents/MacOS/ILoveNotch"
      - name: Package universal DMG
        run: |
          mkdir -p dist
          ditto .build/xcode/Build/Products/Release/ILoveNotch.app "dist/ILoveNotch 中文版.app"
          ln -s /Applications dist/Applications
          hdiutil create -volname "ILoveNotch 中文版" -srcfolder dist -fs HFS+ -format UDZO -ov "ILoveNotch-CN.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ILoveNotch-CN-macOS
          path: ILoveNotch-CN.dmg
          if-no-files-found: error
          retention-days: 30
